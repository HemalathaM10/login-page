<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="screen">

        <div class="cover">

            <div class="rectangle12"></div>

            <div class="rectangle13">
                <img src="Rectangle 13.png">
            </div>
            <div class="rectangle14">
                <img src="Rectangle 14.png">

            </div>
            <div class="group16">
                <img src="Group 16.png">
            </div>

            <div class="title">
                <h1>Login<br>Screen</h1>
            </div>

            <div class="login">

                <div class="rectangle1">

                    <div class="group1">
                        <img src="Group 1.png" class="network">
                        <img src="Login into your account.png" class="text">
                    </div>

                    <form class="login-form">

                        <div class="group2">
                            <label>Email address</label>

                            <div class="email-input">
                                <input type="email" placeholder="alex@email.com">

                                <button type="button">
                                    <img src="Group 4.png">
                                </button>
                            </div>
                        </div>

                        <div class="group3">
                            <label>Password</label>

                            <div class="password-input">
                                <input type="password" placeholder="Enter your password">

                                <button type="button">🔒</button>
                            </div>

                            <a href="#" class="forget-pass">
                                Forgot password?
                            </a>
                        </div>

                        <button type="submit" class="login-now">
                            Login now
                        </button>

                    </form>

                    <div class="group6">
                        <div class="line1"></div>
                        <span>OR</span>
                        <div class="line2"></div>
                    </div>

                    <div class="group7">
                        <p>Signup now</p>
                    </div>

                </div>

                <div class="rectangle2">
                    <img src="Mobile login-pana 1.png">
                </div>

            </div>

        </div>

    </div>

</body>

</html>
